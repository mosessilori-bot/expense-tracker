<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Expense Tracker</h1>
        </header>
        <main>
                <form id="expense-form">
                    <h2>Add New Expense</h2>  
                    <div class="form-group">
                        <label for="expense-name">Expense Name</label>
                        <input type="text" id="expense-name" placeholder="Enter expense name">
                    </div>  
                    <div class="form-group">
                        <label for="expense-amount">Amount(₦)</label>
                        <input type="number" id="expense-amount" placeholder="Enter this expense amount">
                    </div>
                    <div class="form-group">
                        <label for="expense-category">Category</label>
                        <select id="expense-category">
                            <option value="food">Food</option>
                            <option value="transportation">Transportation</option>
                            <option value="utilities">Utilities</option>
                            <option value="entertainment">Entertainment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="expense-date">Date</label>
                        <input type="date" id="expense-date">
                    </div>
                    <button type="submit" id="add-expense">Add Expense</button>
                </form>
            <div id="expense-list">
                <h2>Your Expenses</h2>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 Expense Tracker</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
